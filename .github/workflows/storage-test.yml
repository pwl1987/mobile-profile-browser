name: 存储包测试

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  storage-test:
    name: SQLite 存储层
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.1'

      - name: 获取领域层依赖
        working-directory: packages/mobile_profile_domain
        run: dart pub get

      - name: 获取存储层依赖
        working-directory: packages/mobile_profile_storage
        run: dart pub get

      - name: 存储层静态分析
        working-directory: packages/mobile_profile_storage
        run: dart analyze

      - name: 存储层单元测试
        working-directory: packages/mobile_profile_storage
        run: dart test
